<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https: data:; style-src 'self'; script-src 'self'">
  <title>DM Otomasyon</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="logo">DM</div>
        <div>
          <div class="brand-name">DM Otomasyon</div>
          <div class="brand-sub" id="status-line">Yükleniyor…</div>
        </div>
      </div>
      <nav>
        <button class="nav active" data-view="overview">Genel Bakış</button>
        <button class="nav" data-view="rules">Otomasyonlar</button>
        <button class="nav" data-view="accounts">Hesaplar</button>
        <button class="nav" data-view="activity">Aktivite</button>
        <button class="nav" data-view="settings">Ayarlar</button>
        <button class="nav" data-view="help">Kurulum Rehberi</button>
      </nav>
      <div class="sidebar-foot" id="version"></div>
    </aside>

    <main>
      <div id="dry-banner" class="banner hidden">
        <strong>Test modu açık.</strong> Mesajlar gerçekten gönderilmiyor, sadece "Aktivite" sayfasına ne gönderileceği yazılıyor.
        <button class="btn small" id="dry-off" data-testid="dry-off">Gerçek gönderimi aç</button>
      </div>

      <section class="view" id="view-overview"></section>
      <section class="view hidden" id="view-rules"></section>
      <section class="view hidden" id="view-accounts"></section>
      <section class="view hidden" id="view-activity"></section>
      <section class="view hidden" id="view-settings"></section>
      <section class="view hidden" id="view-help"></section>
    </main>
  </div>

  <dialog id="rule-dialog" class="dialog"></dialog>
  <div id="toast" class="toast hidden"></div>

  <script src="app.js"></script>
</body>
</html>
